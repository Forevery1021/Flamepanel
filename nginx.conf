user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 优化配置
    sendfile        on;
    keepalive_timeout  65;

    # 前端资源 gzip 压缩（JS/CSS/JSON/SVG 是主要收益来源）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # F-11: 请求体大小上限与后端正齐（2GB），并放宽代理读写超时防长操作被网关切断
    client_max_body_size 2g;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 5s;

    # 基础安全头（P2）：防 MIME 嗅探 / 点击劫持 / 反射型 XSS
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # ── P0-5 / T0-5：内容安全策略基线 ─────────────────────────────────
    # Doc/33 P-6：策略单一来源 frontend/scripts/csp.ts，前端构建产出 dist/csp.conf（含实算的
    # 首屏脚本哈希），此处 include——前端升级即自动更新；护栏见 frontend/src/config/__tests__/csp.spec.ts。
    # 注意 add_header 的继承规则：下级块一旦自带 add_header，上层全部头**不再继承**，
    # 故下文各自带 add_header 的块内均重复声明 CSP（护栏见同一 spec）。
    # frame-ancestors 只能经 HTTP 头下发（meta 形式会被浏览器忽略），故仅在此处出现。
    include /app/frontend/dist/csp.conf;

    # Ops Panel 主配置
    server {
        listen 80;
        server_name _;

        # 静态资源（前端构建产物）
        root /app/frontend/dist;
        index index.html;

        # 后端健康检查（与前端路由区分）
        location = /health {
            proxy_pass http://127.0.0.1:8080;
        }

        # Prometheus 指标：按安全基线收紧，仅允许内网/本机访问
        # （指标含进程/资源详情，公网暴露风险面大；需要公网时建议 Basic Auth 或反代层鉴权）
        location = /metrics {
            allow 127.0.0.1;
            allow ::1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://127.0.0.1:8080;
        }

        # index.html 不缓存：避免发版后旧 HTML 引用已失效的哈希资源
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            include /app/frontend/dist/csp.conf;
        }

        # 前端路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 认证端点不压缩（响应含令牌且回显用户输入，避免 BREACH 类侧信道）
        location /api/auth/ {
            gzip off;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 代理到 Rust 后端
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 支持（终端）
        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            # F-07: WS 长连接（配合服务端心跳）
            proxy_read_timeout 3600s;
        }

        # 静态资源：文件名带内容哈希 → 一年 + immutable。
        # 自带 add_header 的块不继承 http 级安全头（此前这里只补了 CSP，nosniff / X-Frame-Options 丢失）
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            include /app/frontend/dist/csp.conf;
        }
    }

