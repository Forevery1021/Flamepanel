[workspace]
members = ["agent", "flame-kernel"]
resolver = "2"

# Supported minimum compiler; the exact tested toolchain is rust-toolchain.toml.
[workspace.package]
rust-version = "1.98.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep unwinding: a request panic must not abort the entire panel process.

[profile.dev]
opt-level = 1