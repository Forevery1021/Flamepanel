services:
  flamepanel:
    build: .
    ports:
      - "8080:80"
    volumes:
      - flamepanel-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    environment:
      - OP_PORT=8080
      - OP_JWT_SECRET=your-super-secret-key-change-me-2026
      - OP_DATABASE_URL=sqlite:/app/data/flamepanel.db?mode=rwc
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 可选：同机部署节点 Agent（取消注释并配置）
    # agent:
    #   build:
    #     context: ./agent
    #     dockerfile: Dockerfile
    #   environment:
    #     - PANEL_URL=http://flamepanel:80
    #     - NODE_NAME=panel-host
    #     - AGENT_PORT=9527
    #     - AUTH_TOKEN=change-me-agent-token
    #   ports:
    #     - "9527:9527"
    #   restart: unless-stopped

volumes:
  flamepanel-data:
