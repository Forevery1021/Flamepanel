[package]
name = "flamepanel-agent"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "flamepanel-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
axum = { version = "0.8", features = ["json", "multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
# Agent Edge 出站反向通道（Doc/23 §8）：均为工作区既有依赖（axum / reqwest / 内核已引入），
# 不增加 Cargo.lock 中的 crate。
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
# wss 连接器自行组装（与 reqwest 同一套 rustls 0.23 + ring + webpki-roots 1.0），避免引入 0.26 兼容层
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
# Edge 请求回放：在进程内把 req 帧交给本机 axum 路由（Service::oneshot）
tower = { version = "0.5", default-features = false, features = ["util"] }
# 远程终端 PTY（与内核本机终端同一实现；仅 AGENT_TERMINAL=1 时启用）
portable-pty = "0.8"
