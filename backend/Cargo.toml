[package]
name = "ops-panel-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json", "ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
bcrypt = "0.19"
sysinfo = "0.39"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
figment = { version = "0.10", features = ["env", "toml"] }
tera = "1.20"
lazy_static = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
toml = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
nvml-wrapper = "0.10"
flate2 = "1"
tar = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "rustls-tls", "smtp-transport"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
bollard = "0.18"
wasmtime = "31"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
