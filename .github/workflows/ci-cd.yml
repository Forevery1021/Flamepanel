name: Quality gates

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  HUSKY: "0"

jobs:
  installer-regression:
    name: Installer regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check installer syntax and offline regression
        run: |
          bash scripts/check-install.sh
          python3 scripts/gen-api-docs.py --check
          python3 scripts/check-shell-exec.py
          python3 -m unittest discover -s scripts/tests -p test_release_assets.py
          python3 -m unittest discover -s scripts/tests -p test_migration_docs.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm and verify toolchain
        run: |
          npm install --global "$(node -p "require('./frontend/package.json').packageManager")"
          npm --prefix frontend run check:toolchain

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Frontend Bundle Size Gate
        run: cd frontend && npm run bundle:check

      - name: Frontend Typecheck
        run: cd frontend && npm run typecheck

      # Coverage runs the complete unit suite; do not run it twice.
      - name: Frontend Coverage Gate
        run: cd frontend && npm run test:coverage

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Frontend i18n Key Gate
        run: cd frontend && npm run locale:check

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: cd frontend && npm run commitlint

      - name: Security Audit (Frontend)
        run: |
          cd frontend && npm audit --audit-level=high

  # Exercise the production SQLite backend, not the in-memory substitute.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Check pinned Rust toolchain
        run: bash scripts/check-rust-toolchain.sh

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Backend
        run: cargo build --locked --package flame-kernel

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm and verify toolchain
        run: |
          npm install --global "$(node -p "require('./frontend/package.json').packageManager")"
          npm --prefix frontend run check:toolchain

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Run E2E
        run: cd frontend && npm run e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  rust-format-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Check pinned Rust toolchain
        run: bash scripts/check-rust-toolchain.sh

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Check pinned Rust toolchain
        run: bash scripts/check-rust-toolchain.sh

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --locked --all

      - name: Build All Features
        run: cargo build --locked --package flame-kernel --all-features

      - name: Build Minimal (no-default-features + sqlite)
        run: cargo build --locked --package flame-kernel --no-default-features --features sqlite

      - name: Build Release
        run: cargo build --locked --release --package flame-kernel

      - name: OpenAPI snapshot drift
        run: |
          cargo run --locked -q -p flame-kernel --bin export-openapi > /tmp/openapi.json
          diff -u frontend/openapi.json /tmp/openapi.json || (echo "::error::Stale openapi.json; regenerate with cargo run -p flame-kernel --bin export-openapi > frontend/openapi.json" && exit 1)

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Check pinned Rust toolchain
        run: bash scripts/check-rust-toolchain.sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security Audit (Rust)
        run: cargo audit

  docker:
    needs:
      [
        frontend,
        rust-format-clippy,
        rust-test,
        security-audit,
        installer-regression,
      ]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase repository name
        id: lower_repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          REPO="ghcr.io/${{ steps.lower_repo.outputs.repo }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${REPO}:${VERSION},${REPO}:latest" >> "$GITHUB_OUTPUT"
          else
            SHA="${GITHUB_SHA::12}"
            echo "tags=${REPO}:${SHA},${REPO}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build & Push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
