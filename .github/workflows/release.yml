name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (defaults to flame-kernel/Cargo.toml)"
        required: false
        type: string
      create_draft:
        description: "Create a draft release after a successful manual build"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve and validate version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release-assets.py version >> "$GITHUB_OUTPUT"

  build-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm and verify toolchain
        run: |
          npm install --global "$(node -p "require('./frontend/package.json').packageManager")"
          npm --prefix frontend run check:toolchain
      - name: Install locked dependencies
        run: cd frontend && npm ci --no-audit --no-fund
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Package frontend once
        run: |
          mkdir -p release-assets
          tar -czf release-assets/flamepanel-frontend.tar.gz -C frontend/dist .
      - uses: actions/upload-artifact@v5
        with:
          name: release-frontend
          path: release-assets/flamepanel-frontend.tar.gz
          if-no-files-found: error

  build-binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU builds target glibc 2.28, not the runner's newer host glibc.
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
            arch: arm64
          - target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
            arch: amd64-musl
          - target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
            arch: arm64-musl
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust and target
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
          bash scripts/check-rust-toolchain.sh
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build panel, CLI, recovery tools, and agent
        run: |
          cargo zigbuild --locked --release -p flame-kernel -p flamepanel-agent \
            --bins --target "${{ matrix.zig_target }}"
      - name: Package explicitly selected binaries
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets panel-stage agent-stage
          install -m755 "target/$TARGET/release/flame-kernel" panel-stage/flamepanel
          for binary in fpctl fp-restore-probe fp-restore-keycheck; do
            install -m755 "target/$TARGET/release/$binary" "panel-stage/$binary"
          done
          install -m755 "target/$TARGET/release/flamepanel-agent" agent-stage/flamepanel-agent
          tar -czf "release-assets/flamepanel-linux-$ARCH.tar.gz" -C panel-stage .
          tar -czf "release-assets/flamepanel-agent-linux-$ARCH.tar.gz" -C agent-stage .
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.arch }}
          path: release-assets/*.tar.gz
          if-no-files-found: error

  assemble-assets:
    needs: [metadata, build-frontend, build-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete asset set and generate SHA-256 manifest
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/release-assets.py checksums release-assets
      - uses: actions/upload-artifact@v5
        with:
          name: verified-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    if: github.event_name == 'push' || inputs.create_draft
    needs: [metadata, assemble-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: verified-release-assets
          path: release-assets
      # Manual builds publish nothing unless draft creation is explicitly requested.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FlamePanel v${{ needs.metadata.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*-checksums.txt
          generate_release_notes: true
