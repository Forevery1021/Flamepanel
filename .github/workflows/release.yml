name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            pkg_arch: amd64
          - target: aarch64-unknown-linux-gnu
            pkg_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend (release, ${{ matrix.pkg_arch }})
        run: cargo build --release --package flame-kernel --target ${{ matrix.target }}

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Package backend
        run: |
          mkdir -p release-assets/backend-stage
          cp target/${{ matrix.target }}/release/flame-kernel release-assets/backend-stage/flamepanel
          tar -czf release-assets/flamepanel-linux-${{ matrix.pkg_arch }}.tar.gz -C release-assets/backend-stage flamepanel
          rm -rf release-assets/backend-stage

      - name: Package frontend
        run: |
          tar -czf release-assets/flamepanel-frontend.tar.gz -C frontend/dist .

      - name: Generate checksums
        run: |
          cd release-assets
          VERSION=${GITHUB_REF_NAME#v}
          sha256sum flamepanel-linux-*.tar.gz flamepanel-frontend.tar.gz > flamepanel-${VERSION}-checksums.txt
          cat flamepanel-${VERSION}-checksums.txt

      - name: Upload artifacts (amd64)
        if: matrix.pkg_arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: release-amd64
          path: release-assets/*
          if-no-files-found: error

      - name: Upload artifacts (arm64)
        if: matrix.pkg_arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64
          path: release-assets/*
          if-no-files-found: error

  github-release:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
