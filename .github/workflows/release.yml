name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNU 动态链接（默认，兼容主流发行版）
          - target: x86_64-unknown-linux-gnu
            pkg_arch: amd64
          - target: aarch64-unknown-linux-gnu
            pkg_arch: arm64
          # musl 静态链接（单一二进制，无需系统依赖，适合 alpine / 最小容器）
          - target: x86_64-unknown-linux-musl
            pkg_arch: amd64-musl
          - target: aarch64-unknown-linux-musl
            pkg_arch: arm64-musl
          # ARMv7（32 位，树莓派等）
          - target: armv7-unknown-linux-gnueabihf
            pkg_arch: armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cargo-zigbuild：基于 zig 的跨平台编译，统一处理 gnu/musl 目标链接，无需手工配置各架构链接器
      - name: Install cargo-zigbuild
        run: |
          python3 -m pip install ziglang 2>/dev/null || true
          cargo install cargo-zigbuild --locked

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend (release, ${{ matrix.pkg_arch }})
        run: cargo zigbuild --release --package flame-kernel --target ${{ matrix.target }}

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Package backend
        run: |
          mkdir -p release-assets/backend-stage
          cp target/${{ matrix.target }}/release/flame-kernel release-assets/backend-stage/flamepanel
          tar -czf release-assets/flamepanel-linux-${{ matrix.pkg_arch }}.tar.gz -C release-assets/backend-stage flamepanel
          rm -rf release-assets/backend-stage

      - name: Package frontend
        run: |
          tar -czf release-assets/flamepanel-frontend.tar.gz -C frontend/dist .

      - name: Generate checksums
        run: |
          cd release-assets
          VERSION=${GITHUB_REF_NAME#v}
          sha256sum flamepanel-linux-*.tar.gz flamepanel-frontend.tar.gz > flamepanel-${VERSION}-checksums.txt
          cat flamepanel-${VERSION}-checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.pkg_arch }}
          path: release-assets/*
          if-no-files-found: error

  github-release:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
