name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend (release)
        run: cargo build --release --package flame-kernel

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Package release assets
        run: |
          mkdir -p release-assets/backend-stage
          cp target/release/flame-kernel release-assets/backend-stage/flamepanel
          tar -czf release-assets/flamepanel-linux-amd64.tar.gz -C release-assets/backend-stage flamepanel
          tar -czf release-assets/flamepanel-frontend.tar.gz -C frontend/dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
