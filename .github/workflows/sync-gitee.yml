name: Sync to Gitee

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 secrets.GITEE_TOKEN，跳过 Gitee 同步。"
            echo "配置方法: Settings → Secrets and variables → Actions → New repository secret → GITEE_TOKEN"
            echo "令牌获取: https://gitee.com/profile/personal_access_tokens (勾选 projects 权限)"
            exit 0
          fi
          git remote add gitee "https://Forever1021yy:${GITEE_TOKEN}@gitee.com/Forever1021yy/Flamepanel.git"
          git push gitee --all --force
          git push gitee --tags --force
          echo "Gitee 镜像同步完成"
