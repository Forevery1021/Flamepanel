[package]
name = "flame-kernel"
version = "0.1.0"
edition = "2021"
description = "FlamePanel Rust Kernel - Minimal compilable version"

[dependencies]
tokio = { version = "1.34", features = ["full"] }
axum = { version = "0.6", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
tower = "0.4"
tower-http = { version = "0.3", features = ["cors", "trace"] }
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
jsonwebtoken = "9"
regex = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
bollard = "0.18"
futures-util = "0.3"
sysinfo = { version = "0.39", features = ["network"] }
lettre = { version = "0.11", features = ["builder", "smtp-transport", "tokio1-native-tls", "tokio1-rustls-tls"] }
wasmtime = "29"
base64 = "0.22"
sha2 = "0.10"
mime_guess = "2"
serde_yaml = "0.9"

[dev-dependencies]
axum-test = "14"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
wat = "1"
