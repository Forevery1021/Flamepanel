[package]
name = "flame-kernel"
version = "0.1.0"
edition = "2021"
description = "FlamePanel Rust Kernel - Minimal compilable version"

# ── Feature Flags（阶段 3.1 + 3.3）────────────────────────────────────
# default 保持全功能（与既有发布行为一致）；裁剪组合（如 --no-default-features
# --features sqlite）仍可编译，用于最小化二进制 / 嵌入式部署。
[features]
default = ["sqlite", "docker", "wasm", "email"]
# SQLite 持久化后端（sqlx）
sqlite = ["dep:sqlx"]
# Docker 引擎集成（bollard：容器/网络/卷/镜像/Compose）
docker = ["dep:bollard"]
# WASM 插件沙箱（wasmtime：内存/fuel/栈限制 + 哈希完整性）
wasm = ["dep:wasmtime"]
# SMTP 邮件通知（lettre）——vendored openssl 保证 musl/arm 交叉编译无需系统 libssl
email = ["dep:lettre", "dep:openssl"]

[dependencies]
tokio = { version = "1.34", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace"] }
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
jsonwebtoken = "9"
regex = "1"
moka = { version = "0.12", features = ["future", "sync"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
bollard = { version = "0.18", optional = true }
futures-util = "0.3"
sysinfo = { version = "0.39", features = ["network"] }
lettre = { version = "0.11", features = ["builder", "smtp-transport", "tokio1-native-tls", "tokio1-rustls-tls"], optional = true }
# vendored openssl：供 lettre 的 native-tls 在交叉编译（musl/arm）时从源码构建，无需目标系统 libssl
openssl = { version = "0.10", features = ["vendored"], optional = true }
wasmtime = { version = "46", optional = true }
base64 = "0.22"
sha2 = "0.10"
mime_guess = "2"
rcgen = "0.13"
time = "0.3"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# OpenAPI 文档生成（Stage3.3）：编译期生成 openapi.json（GET /api/openapi.json）
utoipa = { version = "5", features = ["axum_extras", "chrono"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
wat = "1"
